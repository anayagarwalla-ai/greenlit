name: release-gate

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm demo:preflight
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Smoke the exact production build
        env:
          NEXT_PUBLIC_SECURITY_EMAIL: security@example.test
          SITE_SMOKE_BASE_URL: http://127.0.0.1:3008
        run: |
          setsid pnpm --filter @greenlit/web start --port 3008 &
          server_group=$!
          cleanup() {
            kill -- "-$server_group" 2>/dev/null || true
            wait "$server_group" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3008/api/health >/dev/null; then
              break
            fi
            sleep 1
          done
          pnpm test:site-smoke
      - run: pnpm release:manifest
      - name: Preserve same-commit release evidence
        uses: actions/upload-artifact@v6
        with:
          name: greenlit-release-${{ github.sha }}
          path: artifacts/release/release-manifest.json
          if-no-files-found: error
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e
      - name: Cross-browser company-demo smoke gate
        env:
          CROSS_BROWSER: "1"
        run: pnpm exec playwright test e2e/company-demo-readiness.spec.ts e2e/accessibility.spec.ts --project=firefox --project=webkit
      - name: Cross-browser billing keyboard gate
        env:
          CROSS_BROWSER: "1"
        run: pnpm exec playwright test e2e/beta-readiness.spec.ts --grep "final invoice confirmation" --project=firefox --project=webkit

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: greenlit_test
    steps:
      - uses: actions/checkout@v6
      - name: Prepare isolated Supabase-compatible database
        run: |
          psql -d postgres -v ON_ERROR_STOP=1 -c "create role anon; create role authenticated; create role service_role bypassrls;"
          createdb greenlit_test
          psql -v ON_ERROR_STOP=1 -f supabase/tests/00_local_supabase_stub.sql
          psql -v ON_ERROR_STOP=1 -c "grant usage on schema auth,storage,extensions,public to service_role; grant all on all tables in schema auth,storage,public to service_role; grant all on all sequences in schema public to service_role; grant execute on all functions in schema auth,storage,public to service_role;"
      - name: Apply every migration in order
        run: for migration in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -f "$migration"; done
      - name: Grant the scratch service role access to migrated objects
        run: psql -v ON_ERROR_STOP=1 -c "grant usage on schema auth,storage,extensions,public to service_role; grant all on all tables in schema auth,storage,public to service_role; grant all on all sequences in schema public to service_role; grant execute on all functions in schema auth,storage,public to service_role;"
      - name: Run state-machine assertions
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/01_atomic_rpc_functional_checks.sql
      - name: Run beta-blocker regression assertions
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/02_beta_blocker_regression_checks.sql
      - name: Run atomic evidence-artifact regression assertions
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/03_atomic_evidence_artifact_regression_checks.sql
      - name: Run final release-integrity regression assertions
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/04_release_integrity_regression_checks.sql
